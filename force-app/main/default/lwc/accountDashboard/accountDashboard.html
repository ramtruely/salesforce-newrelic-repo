<template>

    <lightning-card
        title="Account Dashboard">

        <div class="slds-p-around_medium">

            <template if:true={accounts}>

                <template
                    for:each={accounts}
                    for:item="acc">

                    <p key={acc.Id}>

                        {acc.Name}
                        -
                        {acc.Industry}

                    </p>

                </template>

            </template>

            <lightning-button
                label="Trigger Apex Error"
                onclick={handleError}
                class="slds-m-top_medium">

            </lightning-button>

            <lightning-button
                label="Trigger Frontend Error"
                onclick={triggerFrontendError}
                class="slds-m-top_medium slds-m-left_small">

            </lightning-button>

        </div>

    </lightning-card>

</template>
