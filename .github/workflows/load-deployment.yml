name: LOAD Deployment

on:

  push:
    branches:
      - release

jobs:

  deploy-load:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Authenticate LOAD Org
        run: |

          echo "${{ secrets.SF_AUTH_LOAD }}" > authFile.txt

          sf org login sfdx-url \
            --sfdx-url-file authFile.txt \
            --alias load-org

      - name: Deploy to LOAD Org
        run: |

          sf project deploy start \
            --target-org load-org \
            --wait 30

      - name: Send LOAD Deployment Success Logs
        if: success()
        run: |

          curl -X POST https://log-api.newrelic.com/log/v1 \
          -H "Content-Type: application/json" \
          -H "Api-Key:${{ secrets.NEW_RELIC_API_KEY }}" \
          -d '[
            {
              "message":"LOAD Deployment Successful",
              "pipeline":"deployment",
              "environment":"LOAD",
              "branch":"release",
              "status":"SUCCESS"
             }
          ]'