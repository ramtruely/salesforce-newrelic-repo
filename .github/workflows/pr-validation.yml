# Validation Pipeline has been updated
name: Salesforce Validation Pipeline

on:

  pull_request:
    branches:
      - develop

jobs:

  validate-apex:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |

          npm install --global @salesforce/cli

      - name: Authenticate TEST Org
        run: |

          echo "${{ secrets.SF_AUTH_TEST }}" > authFile.txt

          sf org login sfdx-url \
            --sfdx-url-file authFile.txt \
            --alias test-org

      - name: Validate Deployment
        run: |

          sf project deploy validate \
            --source-dir force-app \
            --target-org test-org \
            --test-level RunSpecifiedTests \
            --tests InvalidTestClass \
            --wait 30

      - name: Send Validation Success Logs
        if: success()
        run: |

          CURRENT_TIME=$(date +%s000)

          curl -X POST https://log-api.newrelic.com/log/v1 \
          -H "Content-Type: application/json" \
          -H "Api-Key:${{ secrets.NEW_RELIC_API_KEY }}" \
          -d "[
            {
              \"common\": {
                \"attributes\": {
                  \"service.name\": \"salesforce-ci\",
                  \"entity.name\": \"github-actions-validation\",
                  \"entity.type\": \"ci-pipeline\",
                  \"team\": \"salesforce-devops\",
                  \"pipeline\": \"validation\",
                  \"environment\": \"TEST\",
                  \"workflow\": \"${{ github.workflow }}\"
                }
              },
              \"logs\": [
                {
                  \"timestamp\": $CURRENT_TIME,
                  \"message\": \"PR Validation Successful\",
                  \"attributes\": {
                    \"branch\": \"${{ github.head_ref }}\",
                    \"repository\": \"${{ github.repository }}\",
                    \"actor\": \"${{ github.actor }}\",
                    \"status\": \"SUCCESS\"
                  }
                }
              ]
            }
          ]"

      - name: Send Validation Failure Logs
        if: failure()
        run: |

          CURRENT_TIME=$(date +%s000)

          curl -X POST https://log-api.newrelic.com/log/v1 \
          -H "Content-Type: application/json" \
          -H "Api-Key:${{ secrets.NEW_RELIC_API_KEY }}" \
          -d "[
            {
              \"common\": {
                \"attributes\": {
                  \"service.name\": \"salesforce-ci\",
                  \"entity.name\": \"github-actions-validation\",
                  \"entity.type\": \"ci-pipeline\",
                  \"team\": \"salesforce-devops\",
                  \"pipeline\": \"validation\",
                  \"environment\": \"TEST\",
                  \"workflow\": \"${{ github.workflow }}\"
                }
              },
              \"logs\": [
                {
                  \"timestamp\": $CURRENT_TIME,
                  \"message\": \"PR Validation Failed\",
                  \"attributes\": {
                    \"branch\": \"${{ github.head_ref }}\",
                    \"repository\": \"${{ github.repository }}\",
                    \"actor\": \"${{ github.actor }}\",
                    \"status\": \"FAILED\"
                  }
                }
              ]
            }
          ]"